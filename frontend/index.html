<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>Tienda Online</h1>
            <p>FastAPI + SQLModel + JWT</p>
        </div>
    </header>

    <main>

        <!-- AUTENTICACION -->
        <section id="auth-section" class="auth-grid">

            <div class="card">
                <h2>Iniciar sesión</h2>

                <form id="login-form">
                    <label for="login-username">Usuario</label>
                    <input
                        id="login-username"
                        type="text"
                        required
                    >

                    <label for="login-password">Contraseña</label>
                    <input
                        id="login-password"
                        type="password"
                        required
                    >

                    <button type="submit">
                        Ingresar
                    </button>
                </form>
            </div>


            <div class="card">
                <h2>Registrar usuario</h2>

                <form id="register-form">
                    <label for="register-username">Usuario</label>
                    <input
                        id="register-username"
                        type="text"
                        minlength="3"
                        required
                    >

                    <label for="register-email">Correo</label>
                    <input
                        id="register-email"
                        type="email"
                        required
                    >

                    <label for="register-password">Contraseña</label>
                    <input
                        id="register-password"
                        type="password"
                        minlength="6"
                        required
                    >

                    <button type="submit">
                        Registrarse
                    </button>
                </form>
            </div>

            <p id="auth-mensaje" class="mensaje"></p>

        </section>


        <!-- APLICACION -->
        <section id="app-section" class="oculto">

            <div class="sesion">
                <strong id="usuario-activo"></strong>

                <button id="logout-btn" class="secundario">
                    Cerrar sesión
                </button>
            </div>


            <!-- FORMULARIO PRODUCTO -->
            <section class="card">

                <h2 id="form-title">
                    Nuevo producto
                </h2>

                <form id="producto-form">

                    <input
                        id="producto-id"
                        type="hidden"
                    >

                    <label for="nombre">Nombre</label>
                    <input
                        id="nombre"
                        type="text"
                        minlength="2"
                        maxlength="100"
                        required
                    >

                    <label for="descripcion">Descripción</label>
                    <input
                        id="descripcion"
                        type="text"
                    >

                    <div class="fila">

                        <div>
                            <label for="precio">Precio</label>
                            <input
                                id="precio"
                                type="number"
                                min="0.01"
                                step="0.01"
                                required
                            >
                        </div>

                        <div>
                            <label for="stock">Stock</label>
                            <input
                                id="stock"
                                type="number"
                                min="0"
                                required
                            >
                        </div>

                    </div>

                    <div class="acciones">
                        <button type="submit">
                            Guardar
                        </button>

                        <button
                            id="cancelar-btn"
                            class="secundario oculto"
                            type="button"
                        >
                            Cancelar
                        </button>
                    </div>

                </form>

            </section>


            <!-- LISTADO -->
            <section>

                <div class="titulo-listado">

                    <div>
                        <p class="etiqueta">CATÁLOGO</p>
                        <h2>Productos</h2>
                    </div>

                    <button
                        id="actualizar-btn"
                        class="secundario"
                    >
                        Actualizar
                    </button>

                </div>

                <p id="estado" class="mensaje"></p>

                <div
                    id="productos"
                    class="productos-grid"
                ></div>

            </section>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
